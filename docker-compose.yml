services:
  ceb:
    build: .
    # ou, sans compiler : image: ghcr.io/nvaes/ceb:latest
    container_name: revision-ceb
    ports:
      - "8080:8080"           # http://<ip-du-serveur>:8080
      - "8443:8443"           # https://<ip-du-serveur>:8443 (certificat autosigné)
    volumes:
      - ./pdf:/pdf:ro         # PDF officiels du CEB (on peut aussi les téléverser depuis le site)
      - ceb-data:/data        # pages découpées + progression des enfants (SQLite)
    environment:
      - TZ=Europe/Brussels
      - CEB_HTTPS_PORT=8443   # 0 pour désactiver HTTPS
      # adresses du serveur ajoutées au certificat (fichier .env à côté de ce fichier, non versionné) :
      #   CEB_TLS_SAN=IP:192.168.1.10,DNS:ceb.maison.be
      - CEB_TLS_SAN=${CEB_TLS_SAN:-}
      # - CEB_TRUST_PROXY=1   # derrière un reverse proxy : IP du client lue dans X-Forwarded-For (fail2ban)
      # - CEB_DPI=125         # résolution des pages (plus haut = plus net, plus lourd)
    restart: unless-stopped

volumes:
  ceb-data:
