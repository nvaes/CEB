# Révision CEB — codes parent / enfant incorrects
# Lignes écrites par app/server.py dans <volume /data>/security/auth.log :
#   2026-10-25 10:00:00 CEB-AUTH FAIL ip=192.0.2.10 kind=parent who=-
[Definition]
failregex = ^ CEB-AUTH FAIL ip=<ADDR> kind=\S+
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
